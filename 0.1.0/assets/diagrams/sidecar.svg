<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="title desc">
  <title id="title">A sidecar for one Workload</title>
  <desc id="desc">Separate Workload and Gateway containers share a public CA volume. The parent retains the ephemeral CA key and coordinates the sandboxed worker that negotiates both TLS sessions.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#533066"/></marker></defs>
  <style>
    text {font-family:system-ui,sans-serif;fill:#251c2b}
    .zone {fill:#fcfaff;stroke:#cbbfd3} .box {fill:white;stroke:#7c628a}
    .zone-title {font-weight:650;font-size:15px} .role {font-weight:680;font-size:16px}
    .detail {font-size:13px} .edge {fill:none;stroke:#533066;stroke-width:1.7;marker-end:url(#arrow)}
  </style>
  <rect width="680" height="320" fill="white"/>
  <rect class="zone" x="8" y="10" width="229" height="154" rx="9"/>
  <text class="zone-title" x="23" y="36">Workload container</text>
  <rect class="zone" x="361" y="10" width="311" height="215" rx="9"/>
  <text class="zone-title" x="377" y="36">Gateway container</text>
  <g text-anchor="middle">
    <rect class="box" x="29" y="56" width="187" height="60" rx="6"/>
    <text class="role" x="122" y="81">Workload</text>
    <text class="detail" x="122" y="101">Unprivileged client</text>
    <rect class="box" x="393" y="56" width="246" height="60" rx="6"/>
    <text class="role" x="516" y="81">Gateway parent</text>
    <text class="detail" x="516" y="101">Ephemeral CA key in memory</text>
    <path class="edge" d="M216 86H390"/>
    <text class="detail" x="302" y="72">Private CONNECT</text>
    <rect class="box" x="393" y="161" width="246" height="46" rx="6"/>
    <text class="role" x="516" y="181">Isolated grant worker</text>
    <text class="detail" x="516" y="198">Leaf and TLS session keys</text>
    <path class="edge" d="M516 119V158" marker-start="url(#arrow)"/>
    <rect class="box" x="22" y="241" width="201" height="60" rx="6"/>
    <text class="role" x="122" y="266">Shared volume</text>
    <text class="detail" x="122" y="286">Public CA certificate only</text>
    <path class="edge" d="M122 241V119"/>
    <text class="detail" x="175" y="199">Read-only</text>
    <path class="edge" d="M393 103H318V271H226"/>
    <text class="detail" x="269" y="259">Publish</text>
  </g>
  <text class="detail" x="529" y="145">Private IPC</text>
</svg>
