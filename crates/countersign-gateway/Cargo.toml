[package]
name = "countersign-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
aws-config = { version = "1.13.3", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process"] }
aws-sdk-acmpca = "1.130"
aws-types = "1.7"
aws-smithy-json = "0.65.1"
pem = "3"
countersign-pki = { path = "../countersign-pki" }
countersign-protocol = { path = "../countersign-protocol" }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
ring = "0.17.14"
rustls-pki-types = "1"
thiserror = "2"
time = "0.3"
x509-parser = { version = "0.18", features = ["verify"] }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["io-util", "time", "rt", "net", "macros", "sync", "process", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
ipnet = { version = "2", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["socket", "uio", "process", "resource"] }

[dev-dependencies]
aws-runtime = "1.10"
aws-smithy-http-client = { version = "1.5", features = ["test-util"] }
aws-smithy-types = "1"
tempfile = "3"
