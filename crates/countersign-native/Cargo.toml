[package]
name = "countersign-native"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Native certificate selection and signing for the Countersign desktop Companion"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
countersign-protocol.workspace = true
getrandom = "0.3"
hex = "0.4"
napi = { version = "3", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "3"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt"] }
x509-parser = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
x509-parser = { version = "0.18", features = ["verify"] }
cryptoki = "0.12"
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = { version = "3.7", features = ["macos-12"] }
security-framework-sys = "2.17"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
