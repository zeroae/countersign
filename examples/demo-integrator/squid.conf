# The egress proxy of the Compose demo's Squid variant (compose_demo.py --squid).
# The launcher writes this file to the demo's state with the site's address in
# place of @SITE_PREFIXES@, and every other address in place of @SITE_OUTSIDE@.
# Plain HTTP CONNECT, no TLS interception, no cache.
http_port 3128
pid_filename /run/squid/squid.pid
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
logfile_rotate 0
cache deny all
coredump_dir /tmp
pinger_enable off
shutdown_lifetime 1 seconds

acl CONNECT method CONNECT
acl demo_site dstdomain site.test
acl demo_port port 9444
acl to_metadata dst 169.254.169.254 fd00:ec2::254 168.63.129.16
acl to_link_local dst 169.254.0.0/16 fe80::/10
acl to_loopback dst 127.0.0.0/8 ::1
acl demo_prefixes dst @SITE_PREFIXES@
# A dst ACL matches when any one of a name's addresses is in its list.
acl demo_outside dst @SITE_OUTSIDE@

http_access deny !CONNECT
http_access deny to_metadata
http_access deny to_link_local
http_access deny to_loopback
http_access deny demo_site demo_outside
http_access allow CONNECT demo_site demo_port demo_prefixes
http_access deny all
