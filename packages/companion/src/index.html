<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Countersign</title>
  <link rel="stylesheet" href="./desktop.css">
  <script type="module" src="./renderer.js"></script>
</head>
<body>
  <header class="band">
    <div class="brandrow" id="brand-countersign">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="8" width="18" height="6"/>
        <rect x="11" y="18" width="18" height="6"/>
      </svg>
      <span class="wordmark">countersign</span>
    </div>
    <div class="brandrow" id="brand-integrator" hidden>
      <img class="int-logo" id="int-logo" alt="" hidden>
      <span class="int-text"><span class="int-name" id="int-name"></span><span class="int-copy" id="int-copy"></span></span>
      <span class="verified-chip" id="int-origin"></span>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button type="button" class="tab" data-tab="requests">Requests<span class="badge" id="badge" hidden></span></button>
      <button type="button" class="tab" data-tab="integrators">Integrators</button>
      <button type="button" class="tab" data-tab="settings">Settings</button>
    </nav>
  </header>
  <main class="content" id="content"></main>
  <footer class="footer">
    <p class="feedback" id="feedback" role="alert"></p>
    <span class="plate" role="img" aria-label="countersign">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="8" width="18" height="6"/><rect x="11" y="18" width="18" height="6"/></svg>
      <span class="wm">countersign</span>
    </span>
  </footer>
  <dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-body">
    <h2 id="dialog-title"></h2>
    <p id="dialog-body"></p>
    <div class="btnrow">
      <button type="button" class="btn" id="dialog-cancel">Cancel</button>
      <button type="button" class="btn" id="dialog-confirm"></button>
    </div>
  </dialog>
</body>
</html>
