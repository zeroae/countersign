<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Countersign</title>
  <link rel="stylesheet" href="./desktop.css">
  <script type="module" src="./renderer.js"></script>
</head>
<body>
  <header><span class="mark" aria-hidden="true">C</span><h1>Countersign</h1></header>
  <main>
    <section id="enrollment">
      <h2>Pair an Integrator</h2>
      <form id="pair"><label>Integrator origin <input id="origin" type="url" placeholder="https://integrator.example" required></label>
        <button>Pair</button></form>
      <div id="pending" role="status"></div>
    </section>
    <section aria-labelledby="requests-title">
      <h2 id="requests-title">Approval requests</h2>
      <div id="requests"></div>
    </section>
    <section aria-labelledby="pairs-title"><h2 id="pairs-title">Paired Integrators</h2><div id="pairs"></div></section>
    <label><input id="login" type="checkbox"> Start at login</label>
    <p id="feedback" role="alert"></p>
  </main>
</body>
</html>
