<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" role="img" aria-labelledby="title desc">
  <title id="title">Countersign system architecture</title>
  <desc id="desc">Workload TLS terminates at the Gateway. Separate mTLS connects the Gateway to the site. The backend and Gateway contact the Broker. The desktop initiates an authenticated WebSocket to the Broker and signs locally with the OS provider. Solid arrows are application traffic; dashed arrows are control and signing.</desc>
  <defs>
    <marker id="data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="head-traffic" d="M0 0 8 4 0 8Z"/></marker>
    <marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="head-control" d="M0 0 8 4 0 8Z"/></marker>
  </defs>
  <style>
    /* palette:start */ svg{--bg:#ffffff;--text:#251c2b;--muted:#403748;--zone-fill:#fbf9fd;--zone-stroke:#cbbfd3;--desk-fill:#f6faf5;--desk-stroke:#a8bfa6;--surface:#ffffff;--actor-fill:#f5eff9;--box-stroke:#7c628a;--local-stroke:#69836b;--traffic:#3d174f;--control:#315638;--note-text:#213c14;--band-request:#f6f2f9;--band-sign:#f2f6ef;--font:DejaVu Sans, Verdana, sans-serif} /* palette:end */
    text {font-family:var(--font);fill:var(--text)}
    .bg {fill:var(--bg)}
    .zone {fill:var(--zone-fill);stroke:var(--zone-stroke)}
    .desktop {fill:var(--desk-fill);stroke:var(--desk-stroke)}
    .box {fill:var(--surface);stroke:var(--box-stroke)}
    .local {fill:var(--surface);stroke:var(--local-stroke)}
    .boundary {font-size:15px;font-weight:bold}
    .role {font-size:17px;font-weight:bold}
    .detail {font-size:13px;fill:var(--muted)}
    .label {font-size:13px;fill:var(--control);font-weight:bold}
    .traffic {fill:none;stroke:var(--traffic);stroke-width:2;marker-end:url(#data)}
    .ctrl {fill:none;stroke:var(--control);stroke-width:1.7;stroke-dasharray:5 4;marker-end:url(#control)}
    .head-traffic {fill:var(--traffic)} .head-control {fill:var(--control)}
  </style>
  <rect class="bg" width="680" height="450"/>
  <rect class="zone" x="8" y="10" width="440" height="245" rx="10"/>
  <text class="boundary" x="25" y="38">Integrator’s infrastructure</text>
  <rect class="desktop" x="8" y="295" width="664" height="111" rx="10"/>
  <text class="boundary" x="25" y="320">User’s computer</text>

  <g text-anchor="middle">
    <rect class="box" x="26" y="65" width="146" height="66" rx="6"/>
    <text class="role" x="99" y="93">Workload</text>
    <text class="detail" x="99" y="114">curl · Python · Node</text>
    <rect class="box" x="250" y="65" width="176" height="66" rx="6"/>
    <text class="role" x="338" y="93">Gateway</text>
    <text class="detail" x="338" y="114">Traffic keys and plaintext</text>
    <rect class="box" x="489" y="65" width="182" height="66" rx="6"/>
    <text class="role" x="580" y="93">Protected site</text>
    <text class="detail" x="580" y="114">Verifies client certificate</text>
    <path class="traffic" d="M172 99H247"/>
    <path class="traffic" d="M426 99H486"/>
    <text class="detail" x="210" y="88">TLS</text>
    <text class="detail" x="457" y="88">mTLS</text>

    <rect class="box" x="26" y="170" width="146" height="63" rx="6"/>
    <text class="role" x="99" y="197">Backend</text>
    <text class="detail" x="99" y="218">Account and Context</text>
    <rect class="box" x="250" y="170" width="176" height="63" rx="6"/>
    <text class="role" x="338" y="197">Broker</text>
    <text class="detail" x="338" y="218">Approvals and leases</text>
    <path class="ctrl" d="M172 214H247"/>
    <text class="label" x="210" y="205">Bind job</text>

    <rect class="local" x="246" y="332" width="184" height="56" rx="6"/>
    <text class="role" x="338" y="356">Companion</text>
    <text class="detail" x="338" y="376">User reviews and approves</text>
    <rect class="local" x="482" y="332" width="176" height="56" rx="6"/>
    <text class="role" x="570" y="356">OS key provider</text>
    <text class="detail" x="570" y="376">Holds client private key</text>
    <path class="ctrl" d="M430 360H479"/>
    <text class="label" x="455" y="350">Sign</text>
  </g>
  <path class="ctrl" d="M338 131V167"/>
  <text class="label" x="350" y="154">Authorize</text>
  <path class="ctrl" d="M338 332V236"/>
  <text class="label" x="353" y="281">Outbound authenticated WebSocket</text>

  <g class="legend">
    <path class="traffic" d="M26 431H62"/>
    <text class="detail" x="72" y="435">Application traffic</text>
    <path class="ctrl" d="M220 431H256"/>
    <text class="detail" x="266" y="435">Control and signing</text>
  </g>
</svg>
