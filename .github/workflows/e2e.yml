name: Sidecar mTLS
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
jobs:
  gateway-arm64:
    # The seccomp allow-list is written per architecture. On x86-64 the
    # containment test runs in ci.yml and the runtime test in the job below.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y apparmor-profiles bubblewrap libnss-wrapper
      - name: Enable the distribution's bubblewrap profile when the host restricts user namespaces
        run: |
          if ! bwrap --unshare-all --cap-drop ALL --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 -- /usr/bin/true; then
            sudo apparmor_parser --replace /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            bwrap --unshare-all --cap-drop ALL --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 -- /usr/bin/true
          fi
      - uses: Swatinem/rust-cache@v2
      - run: pip install cryptography==50.0.2
      - run: cargo test --locked -p countersign-gateway
      - run: cargo build --locked -p countersign-gateway
      - name: Exercise shared and sidecar workers and lease cutoff
        run: timeout 120 python crates/countersign-gateway/tests/runtime.py target/debug/countersign-gateway
      - name: Name the system call when the worker sandbox's filter killed a grant worker
        if: failure()
        run: sudo dmesg | grep 'type=1326' | tail -n 20 || true
  gateway-filter-sandbox:
    # A container under Docker's default security profile refuses namespaces,
    # as ECS Fargate does. The script runs the containment test and the
    # runtime test under the filter sandbox there, and proves that the
    # namespace sandbox fails at startup with the named error.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run the Gateway under the filter sandbox where namespaces are refused
        run: scripts/filter-sandbox-container.sh
      - name: Name the system call when the worker sandbox's filter killed a grant worker
        if: failure()
        run: sudo dmesg | grep 'type=1326' | tail -n 20 || true
  curl:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y apparmor-profiles bubblewrap gnome-keyring libsecret-tools libnss3-dev libnss-wrapper softhsm2 xvfb xauth libgtk-3-0t64
      - name: Enable the distribution's bubblewrap profile when the host restricts user namespaces
        run: |
          if ! bwrap --unshare-all --cap-drop ALL --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 -- /usr/bin/true; then
            sudo apparmor_parser --replace /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            bwrap --unshare-all --cap-drop ALL --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 -- /usr/bin/true
          fi
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pip install -r examples/demo-integrator/test/fixture-requirements.txt
      - run: cargo build --locked --workspace
      - name: Exercise shared and sidecar workers and lease cutoff
        run: timeout 120 python crates/countersign-gateway/tests/runtime.py target/debug/countersign-gateway
      - name: Name the system call when the worker sandbox's filter killed a grant worker
        if: failure()
        run: sudo dmesg | grep 'type=1326' | tail -n 20 || true
      - run: node scripts/native-package.mjs debug
      - run: pnpm --filter @countersign/companion exec electron-builder --dir --publish never
      - name: Choose the last identity and compare it to the upstream TLS peer
        run: |
          for count in 2 3; do
            timeout 180 dbus-run-session -- xvfb-run -a python examples/demo-integrator/test/e2e.py --app packages/companion/dist/linux-unpacked/countersign-companion --count "$count"
          done
